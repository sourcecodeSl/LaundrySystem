name: Deploy to production (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Build the React SPA ---
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Copy SPA into Laravel public
        run: cp -r frontend/dist/. backend/public/

      # --- Install backend (production) dependencies ---
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql, gd, zip
          tools: composer:v2

      - name: Install backend deps (no dev)
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # --- Deploy over FTPS with lftp (reconnects/resumes on dropped sessions) ---
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          SETTINGS="
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:timeout 15;
            set net:max-retries 8;
            set net:persist-retries 8;
            set net:reconnect-interval-base 5;
            set mirror:parallel-transfer-count 2;
            set cmd:fail-exit true;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"ftp://$FTP_SERVER\";
          "

          # vendor/ rarely changes: compare by size only so existing files are
          # skipped and we never re-upload the whole tree.
          lftp -e "$SETTINGS
            mirror -R --size-only --no-perms --parallel=2 --verbose \
              backend/vendor/ /vendor/;
            bye"

          # Application code + built SPA (excludes vendor and local-only files).
          lftp -e "$SETTINGS
            mirror -R --no-perms --parallel=2 --verbose \
              --exclude-glob .git* \
              --exclude 'vendor/' \
              --exclude 'node_modules/' \
              --exclude 'tests/' \
              --exclude-glob .env \
              --exclude-glob .env.* \
              --exclude 'storage/logs/' \
              --exclude 'storage/framework/cache/' \
              --exclude 'storage/framework/sessions/' \
              --exclude 'storage/framework/views/' \
              --exclude-glob phpunit.xml \
              --exclude-glob .phpunit* \
              backend/ /;
            bye"
