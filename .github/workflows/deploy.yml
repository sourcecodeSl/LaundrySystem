name: Deploy to production (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_vendor:
        description: 'Also re-sync vendor/ (do this when composer deps change)'
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Build the React SPA ---
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Copy SPA into Laravel public
        run: cp -r frontend/dist/. backend/public/

      # --- Deploy application code (fast: excludes the huge vendor/ tree) ---
      # vendor/ lives on the server and rarely changes, so keeping it out of the
      # normal deploy keeps each FTP session short enough to finish reliably.
      - name: Deploy app code
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./backend/
          server-dir: ./
          timeout: 120000
          state-name: .ftp-deploy-app.json
          exclude: |
            **/.git*
            **/.git*/**
            **/vendor/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/.phpunit.*
            **/phpunit.xml

      # --- Re-sync vendor/ only on demand (manual run with upload_vendor=true) ---
      - name: Set up PHP
        if: ${{ inputs.upload_vendor }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql, gd, zip
          tools: composer:v2

      - name: Install backend deps (no dev)
        if: ${{ inputs.upload_vendor }}
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Deploy vendor
        if: ${{ inputs.upload_vendor }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./backend/vendor/
          server-dir: ./vendor/
          timeout: 120000
          state-name: .ftp-deploy-vendor.json
