name: Deploy to production (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_vendor:
        description: 'Re-sync vendor/ (needed when composer deps changed)'
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # vendor/ is large and rarely changes, so it is only re-synced when
      # composer.lock changed in this push, or on a manual run with
      # upload_vendor=true. Normal deploys push app code + the SPA only (fast).
      - name: Decide whether to sync vendor
        id: vendor
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload_vendor }}" = "true" ]; then
            echo "sync=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qx 'backend/composer.lock'; then
            echo "sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "sync=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Build the React SPA ---
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Copy SPA into Laravel public
        run: cp -r frontend/dist/. backend/public/

      # --- Backend prod deps (only when vendor needs re-syncing) ---
      - name: Set up PHP
        if: steps.vendor.outputs.sync == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql, gd, zip
          tools: composer:v2

      - name: Install backend deps (no dev)
        if: steps.vendor.outputs.sync == 'true'
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # --- Deploy over FTPS with lftp (reconnects/resumes on dropped sessions) ---
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SYNC_VENDOR: ${{ steps.vendor.outputs.sync }}
        run: |
          set -euo pipefail
          # Script written via printf so credentials (which contain special
          # characters incl. a comma) are passed literally, not re-parsed.
          {
            printf '%s\n' "set ftp:ssl-force true"
            printf '%s\n' "set ftp:ssl-protect-data true"
            printf '%s\n' "set ssl:verify-certificate no"
            printf '%s\n' "set ftp:passive-mode true"
            printf '%s\n' "set net:timeout 15"
            printf '%s\n' "set net:max-retries 8"
            printf '%s\n' "set net:persist-retries 8"
            printf '%s\n' "set net:reconnect-interval-base 5"
            printf '%s\n' "set mirror:parallel-transfer-count 2"
            printf '%s\n' "set cmd:fail-exit true"
            printf 'open "ftp://%s"\n' "$FTP_SERVER"
            printf 'user "%s" "%s"\n' "$FTP_USERNAME" "$FTP_PASSWORD"
            if [ "$SYNC_VENDOR" = "true" ]; then
              printf '%s\n' "mirror -R --ignore-time --no-perms --parallel=2 --verbose backend/vendor/ /vendor/"
            fi
            printf '%s\n' "mirror -R --no-perms --parallel=2 --verbose --exclude-glob .git* --exclude vendor/ --exclude node_modules/ --exclude tests/ --exclude-glob .env --exclude-glob .env.* --exclude storage/logs/ --exclude storage/framework/cache/ --exclude storage/framework/sessions/ --exclude storage/framework/views/ --exclude-glob phpunit.xml --exclude-glob .phpunit* backend/ /"
            printf '%s\n' "bye"
          } > deploy.lftp
          lftp -f deploy.lftp
          rm -f deploy.lftp
